<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0724">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bonzo">
<title>Big Top Bonzo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Night under the big top: indigo canvas, warm gold light, crimson ring */
  :root{color-scheme:dark;--bg:#0d0724;--glass:rgba(255,255,255,.12);--glass-on:rgba(255,200,74,.38);--edge:rgba(255,255,255,.28);
    --gold:#ffc84a;--red:#ff4d6d;--red-dk:#c8174a;--ink:#fff8ee;--muted:#c9bfe8;
    --font:"Fredoka","Baloo 2","Nunito",system-ui,sans-serif}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--font);color:var(--ink)}
  canvas{display:block;touch-action:none}
  #pad{display:none}
  body.touch #pad{display:block}
  body.touch.portrait{align-items:flex-start;padding-top:env(safe-area-inset-top)}
  .ctl{position:fixed;touch-action:none;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
    border:1px solid var(--edge);background:var(--glass);color:var(--ink);font:inherit;padding:0;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .ctl svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  #dpad{left:calc(16px + env(safe-area-inset-left));bottom:calc(18px + env(safe-area-inset-bottom));width:172px;height:80px;border-radius:40px}
  #dpad span{flex:1;height:100%;display:flex;align-items:center;justify-content:center;border-radius:40px;transition:background .08s}
  #dpad span.on{background:var(--glass-on)}
  #dpad svg{width:30px;height:30px;fill:currentColor;stroke:none}
  #jump{right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:100px;height:100px;border-radius:50%;
    border:none;background:radial-gradient(circle at 35% 30%,#ff8aa0,var(--red) 45%,var(--red-dk));font-size:17px;font-weight:700;letter-spacing:.06em;
    box-shadow:0 8px 22px rgba(200,23,74,.45),inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .06s}
  #jump.on{transform:scale(.93);filter:brightness(1.12)}
  .small{top:calc(10px + env(safe-area-inset-top));width:44px;height:44px;border-radius:14px}
  #pauseBtn{right:calc(12px + env(safe-area-inset-right))}
  #soundBtn{right:calc(64px + env(safe-area-inset-right))}
  #fsBtn{right:calc(116px + env(safe-area-inset-right))}
  #soundBtn .slash{display:none}
  #soundBtn.off .slash{display:inline}
  #soundBtn.off{color:var(--muted)}
  body.portrait .small{top:auto;bottom:calc(132px + env(safe-area-inset-bottom))}
  #stages{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:none;flex-wrap:wrap;gap:8px;
    justify-content:center;padding:0 16px}
  #stages button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--glass);border:1px solid var(--edge);border-radius:999px;
    height:44px;padding:0 16px;touch-action:manipulation;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  #stages button:active{background:var(--glass-on)}
  #stages button.pool{border-color:rgba(90,190,255,.6)}
  #stages .hint{width:100%;text-align:center;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  body.touch.st-title #stages{display:flex}
  body.st-title #dpad,body.st-title #jump,body.st-title #pauseBtn{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pad">
  <div id="dpad" class="ctl" aria-label="Move left or right">
    <span data-d="l"><svg viewBox="0 0 24 24"><path d="M15 5 7 12l8 7z"/></svg></span>
    <span data-d="r"><svg viewBox="0 0 24 24"><path d="m9 5 8 7-8 7z"/></svg></span>
  </div>
  <div id="jump" class="ctl" role="button" aria-label="Jump">JUMP</div>
  <button id="pauseBtn" class="ctl small" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
  <button id="soundBtn" class="ctl small" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 9a4 4 0 0 1 0 6"/><path class="slash" d="M3 3l18 18"/></svg></button>
  <button id="fsBtn" class="ctl small" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <div id="stages">
    <div class="hint">Tap the screen to play, or pick a stage</div>
    <button data-s="1">Lion</button><button data-s="2">Wire</button><button data-s="3">Trampoline</button>
    <button data-s="4">Ball</button><button data-s="5">Horse</button><button data-s="6">Trapeze</button>
    <button data-s="7" class="pool">Piranha pool</button>
  </div>
</div>
<script>
'use strict';
// =====================================================================
//  BIG TOP BONZO
// =====================================================================
const H = 240, GROUND = 200, MPX = 32, GRAV = 600;
let W = 384; // visible world width; follows the screen's shape (256 to 528)
const FONT = '"Fredoka", "Baloo 2", "Nunito", system-ui, sans-serif';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let S = 2, DPR = 1, PORTRAIT = false;
let TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  const vw = innerWidth, vh = innerHeight;
  PORTRAIT = vh > vw;
  document.body.classList.toggle('touch', TOUCH);
  document.body.classList.toggle('portrait', TOUCH && PORTRAIT);
  // in portrait on touch devices, keep the bottom area free for the controls
  const availH = TOUCH && PORTRAIT ? Math.max(H, vh - 240) : vh;
  if (!(vw > 0 && availH > 0)) return; // the window can briefly report 0x0 while the page loads
  W = Math.round(clamp(H * vw / availH, 256, 528)); // up to ~20:9 so tall phones fill the screen
  S = Math.min(vw / W, availH / H);
  cv.style.width = W * S + 'px'; cv.style.height = H * S + 'px';
  cv.style.marginTop = TOUCH && PORTRAIT ? Math.max(0, (vh - 240 - H * S) / 2) + 'px' : '0';
  cv.width = Math.round(W * S * DPR); cv.height = Math.round(H * S * DPR);
}

// ---------------------------------------------------------------- utils
function RNG(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
const toward = (v, t, s) => v + clamp(t - v, -s, s);
const hit = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
const fmt = n => Math.max(0, Math.floor(n)).toLocaleString('en-US');
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function mkC(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
addEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 150)); resize();
addEventListener('load', resize);

// ---------------------------------------------------------------- input
const keys = {}; let pressed = {};
const touch = { left: false, right: false, jump: false, jumpP: false };
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true; AU.unlock();
});
addEventListener('keyup', e => { keys[e.code] = false; });
// ---- on-screen controls (multi-touch via pointer events)
const $ = id => document.getElementById(id);
const capture = (el, e) => { try { el.setPointerCapture(e.pointerId); } catch (err) {} };
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };
addEventListener('pointerdown', e => {
  AU.unlock();
  if (e.pointerType === 'touch' && !TOUCH) { TOUCH = true; resize(); }
}, true);
// d-pad: slide a thumb between left and right without lifting it
const dpadPtrs = new Map();
function dpadRefresh() {
  const r = $('dpad').getBoundingClientRect(); let l = false, rt = false;
  for (const x of dpadPtrs.values()) { if (x < r.left + r.width / 2) l = true; else rt = true; }
  touch.left = l; touch.right = rt;
  $('dpad').children[0].classList.toggle('on', l); $('dpad').children[1].classList.toggle('on', rt);
}
$('dpad').addEventListener('pointerdown', e => { e.preventDefault(); capture($('dpad'), e); dpadPtrs.set(e.pointerId, e.clientX); dpadRefresh(); buzz(); });
$('dpad').addEventListener('pointermove', e => { if (dpadPtrs.has(e.pointerId)) { dpadPtrs.set(e.pointerId, e.clientX); dpadRefresh(); } });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => $('dpad').addEventListener(t, e => { dpadPtrs.delete(e.pointerId); dpadRefresh(); }));
// jump button
const jumpPtrs = new Set();
function jumpRefresh() { const j = jumpPtrs.size > 0; if (j && !touch.jump) touch.jumpP = true; touch.jump = j; $('jump').classList.toggle('on', j); }
$('jump').addEventListener('pointerdown', e => { e.preventDefault(); capture($('jump'), e); jumpPtrs.add(e.pointerId); jumpRefresh(); buzz(); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => $('jump').addEventListener(t, e => { jumpPtrs.delete(e.pointerId); jumpRefresh(); }));
// tapping the game screen also jumps / starts / continues
cv.addEventListener('pointerdown', e => { e.preventDefault(); touch.jumpP = true; });
$('pauseBtn').addEventListener('pointerdown', e => { e.preventDefault(); pressed.KeyP = true; });
$('soundBtn').addEventListener('pointerdown', e => { e.preventDefault(); pressed.KeyM = true; });
const fsEl = document.documentElement;
if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) $('fsBtn').style.display = 'none';
$('fsBtn').addEventListener('click', () => {
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else {
    const p = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
    if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
  }
});
document.querySelectorAll('#stages button').forEach(b => b.addEventListener('click', e => {
  e.stopPropagation(); AU.unlock(); const s = +b.dataset.s;
  if (state === 'title') newGame(s === 7 ? 3 : s, s === 7);
}));
['contextmenu', 'gesturestart', 'dblclick'].forEach(t => addEventListener(t, e => e.preventDefault()));
// auto-pause when the app goes to the background
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') { setState('pause'); MUS.stop(); } });
const L = () => keys.ArrowLeft || keys.KeyA || touch.left;
const R = () => keys.ArrowRight || keys.KeyD || touch.right;
const JP = () => pressed.Space || pressed.ArrowUp || pressed.KeyZ || pressed.KeyW || touch.jumpP;
const JH = () => keys.Space || keys.ArrowUp || keys.KeyZ || keys.KeyW || touch.jump;

// ---------------------------------------------------------------- audio
const AU = {
  ctx: null, on: true, master: null,
  unlock() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.45;
        this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d, type = 'square', v = 0.08, f2 = 0, at = 0) {
    if (!this.ctx || !this.on) return;
    const t = at || this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.03);
  },
  later(dt, ...a) { if (this.ctx) this.tone(a[0], a[1], a[2], a[3], a[4], this.ctx.currentTime + dt); }
};
const SFX = {
  jump() { AU.tone(260, 0.16, 'triangle', 0.14, 720); },
  boing(big) { AU.tone(big ? 160 : 200, 0.22, 'triangle', 0.25, big ? 620 : 480); },
  land() { AU.tone(140, 0.06, 'triangle', 0.2, 90); },
  grab() { AU.tone(600, 0.05, 'triangle', 0.1); AU.later(0.05, 900, 0.07, 'triangle', 0.1); },
  score() { AU.tone(988, 0.05, 'sine', 0.08); AU.later(0.05, 1319, 0.12, 'sine', 0.08); },
  tick() { AU.tone(1600, 0.025, 'sine', 0.04); },
  die() { [660, 590, 520, 440, 330, 220].forEach((f, i) => AU.later(i * 0.11, f, 0.14, 'triangle', 0.14)); },
  clear() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => AU.later(i * 0.1, f, i === 5 ? 0.45 : 0.12, 'triangle', 0.14)); },
  oneup() { [784, 988, 1175, 1568].forEach((f, i) => AU.later(i * 0.07, f, 0.1, 'sine', 0.1)); },
  start() { [392, 523, 659, 784].forEach((f, i) => AU.later(i * 0.12, f, 0.14, 'triangle', 0.12)); }
};
// Original oom-pah march (2/4), 8th-note steps
const MEL = [72,0,76,79, 84,0,79,76, 77,0,74,77, 81,0,79,0, 76,0,72,76, 79,0,77,74, 72,74,76,77, 79,0,0,0,
             74,0,77,81, 83,0,81,77, 76,0,79,84, 88,0,84,0, 81,0,77,74, 79,0,76,72, 74,76,74,71, 72,0,0,0];
const CHORDS = [48,48,53,53,48,55,48,55, 55,55,48,48,53,48,55,48];
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const MUS = {
  playing: false, step: 0, next: 0, timer: null, tempo: 0.15,
  start() {
    if (!AU.ctx) return;
    this.playing = true; this.step = 0; this.next = AU.ctx.currentTime + 0.05;
    if (!this.timer) this.timer = setInterval(() => this.tick(), 25);
  },
  stop() { this.playing = false; },
  tick() {
    if (!this.playing || !AU.ctx) return;
    while (this.next < AU.ctx.currentTime + 0.12) {
      const s = this.step % MEL.length, m = MEL[s], root = CHORDS[Math.floor(s / 4)];
      if (m) AU.tone(mf(m), this.tempo * 0.9, 'triangle', 0.075, 0, this.next);
      if (s % 2 === 0) AU.tone(mf(s % 4 === 0 ? root - 12 : root - 5), this.tempo * 0.8, 'sine', 0.16, 0, this.next);
      else AU.tone(mf(root + 4), this.tempo * 0.4, 'triangle', 0.025, 0, this.next);
      this.next += this.tempo; this.step++;
    }
  }
};

// =====================================================================
//  ART  (all vector, drawn in world units; the canvas scales them up crisply)
// =====================================================================
const GOLD = [255, 200, 74], ORANGE = [255, 122, 40], RED = [255, 77, 109], TEAL = [37, 208, 192],
      PINK = [255, 92, 180], WHITE = [255, 255, 255], WARM = [255, 226, 170], BLUE = [90, 170, 255];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function lin(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }
function radg(x0, y0, r0, x1, y1, r1, stops) { const g = ctx.createRadialGradient(x0, y0, r0, x1, y1, r1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }
function circle(x, y, r, f) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fillStyle = f; ctx.fill(); }
function ell(x, y, rx, ry, rot, f) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot || 0, 0, 7); ctx.fillStyle = f; ctx.fill(); }
function rr(x, y, w, h, r, f) {
  ctx.beginPath(); r = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (f) { ctx.fillStyle = f; ctx.fill(); }
}
function seg(x1, y1, x2, y2, w, c) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.strokeStyle = c; ctx.stroke(); }
function poly(pts, f) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fillStyle = f; ctx.fill(); }
function star(x, y, r, f, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  ctx.closePath(); ctx.fillStyle = f; ctx.fill();
}
function heart(x, y, s, f) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.beginPath(); ctx.moveTo(0, 3);
  ctx.bezierCurveTo(-5, -0.5, -3, -5, 0, -2.2); ctx.bezierCurveTo(3, -5, 5, -0.5, 0, 3);
  ctx.fillStyle = f; ctx.fill(); ctx.restore();
}
const glowCache = {};
function glowImg(c) {
  const k = c.join();
  if (glowCache[k]) return glowCache[k];
  const g = mkC(64, 64), x = g.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, rgba(c, 1)); gr.addColorStop(0.3, rgba(c, 0.4)); gr.addColorStop(1, rgba(c, 0));
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return (glowCache[k] = g);
}
function glow(x, y, r, c, a = 1, sy = 1) {
  if (a <= 0.01) return;
  const op = ctx.globalCompositeOperation, ga = ctx.globalAlpha;
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, a);
  ctx.drawImage(glowImg(c), x - r, y - r * sy, r * 2, r * 2 * sy);
  ctx.globalCompositeOperation = op; ctx.globalAlpha = ga;
}
function flame(x, y, w, h, alpha = 1) { // base at (x, y), tip pointing up
  const f = (c, s) => {
    ctx.beginPath(); ctx.moveTo(x, y - h * s);
    ctx.bezierCurveTo(x + w * s * 1.15, y - h * s * 0.45, x + w * s, y, x, y);
    ctx.bezierCurveTo(x - w * s, y, x - w * s * 1.15, y - h * s * 0.45, x, y - h * s);
    ctx.fillStyle = c; ctx.fill();
  };
  ctx.globalAlpha = alpha; f('#ff3d1f', 1); f('#ff9a1f', 0.72); f('#ffe58a', 0.45); ctx.globalAlpha = 1;
}
function shadowAt(sx, h, rx) {
  const k = clamp(1 - h / 100, 0.3, 1);
  ell(sx, GROUND + 0.8, rx * k, rx * 0.22 * k, 0, `rgba(10,0,25,${0.4 * k})`);
}
function text(s, x, y, o = {}) {
  ctx.font = `${o.w || 600} ${o.size || 8}px ${FONT}`;
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'middle';
  if (o.ls !== undefined && 'letterSpacing' in ctx) ctx.letterSpacing = o.ls + 'px';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || 2; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  if (o.shadow) { ctx.fillStyle = o.shadow; ctx.fillText(s, x, y + (o.sd || 1)); }
  ctx.fillStyle = o.color || '#fff8ee'; ctx.fillText(s, x, y);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}

// ---------------------------------------------------------------- Bonzo & friends
const OUTFIT = {
  bonzo:    { suit: '#25d0c0', suitDk: '#0e8a86', dot: '#ffe066', pants: '#4a4fe6', hat: '#ff4f8b', hat2: '#ffd84a', hair: '#ff7a2f', hairDk: '#d9481a', shoe: '#ff3b5c' },
  knifer:   { suit: '#8a6bff', suitDk: '#4e36c4', dot: '#ffffff', pants: '#2b2350', hat: '#2b2350', hat2: '#cfd2ff', hair: '#4a2c1a', hairDk: '#2b170c', shoe: '#1d1530' },
  breather: { suit: '#ff8a2a', suitDk: '#c4501a', dot: '#ffe066', pants: '#a8233a', hat: '#ff4d6d', hat2: '#ffd84a', hair: '#ffd84a', hairDk: '#e0a21a', shoe: '#a8233a' }
};
const BK = 0.62; // Bonzo's art is drawn ~31 units tall and scaled to fit the game's hitboxes
function limb(x, y, a1, l1, a2, l2, w, col) {
  const kx = x + Math.sin(a1) * l1, ky = y + Math.cos(a1) * l1, fx = kx + Math.sin(a2) * l2, fy = ky + Math.cos(a2) * l2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy);
  ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = col; ctx.stroke();
  return [fx, fy];
}
function bonzoPose(pose, ph, t) {

// =====================================================================
//  UPDATE
// =====================================================================
function update(dt) {
  gt += dt; stateT += dt;
  if (pressed.KeyM) { AU.on = !AU.on; $('soundBtn').classList.toggle('off', !AU.on); if (!AU.on) MUS.stop(); else if (state === 'play') MUS.start(); }
  switch (state) {
    case 'title': {
      for (let i = 1; i <= 7; i++) if (pressed['Digit' + i] || pressed['Numpad' + i]) { newGame(i === 7 ? 3 : i, i === 7); return; }
      if (pressed.Enter || pressed.Space || touch.jumpP) newGame(1);
      break;
    }
    case 'intro':
      if (stateT > 2.2) { setState('play'); MUS.start(); }
      break;
    case 'play': {
      if (pressed.KeyP || pressed.Escape) { setState('pause'); MUS.stop(); break; }
      lt += dt;
      bonusT += dt; while (bonusT >= 0.2) { bonusT -= 0.2; bonus = Math.max(0, bonus - 10); }
      LV.update(dt);
      if (state === 'play' || state === 'clear') camX = camFor(P.x);
      break;
    }
    case 'pause':
      if (pressed.KeyP || pressed.Escape || pressed.Enter || touch.jumpP) { setState('play'); MUS.start(); }
      break;
    case 'dying':
      P.dvy += GRAV * dt; P.dy += P.dvy * dt;
      if (stateT > 2.2) {
        lives--;
        if (lives <= 0) { saveHi(); setState('gameover'); }
        else { spawnAt(CP); setState('intro'); }
      }
      break;
    case 'clear':
      if (stateT > 1.4 && bonus > 0) {
        tallyAcc += dt;
        while (tallyAcc >= 0.02 && bonus > 0) {
          tallyAcc -= 0.02; const d = Math.min(100, bonus); bonus -= d; score += d; if (score > hi) hi = score;
          if (score >= nextLife) { lives++; nextLife += 30000; SFX.oneup(); }
          if ((bonus / 100) % 3 === 0) SFX.tick();
        }
      } else if (stateT > 1.4 && tallyDone < 0) tallyDone = stateT;
      if (tallyDone > 0 && stateT > tallyDone + 1.5) { saveHi(); stageNum++; forcePool = false; startStage(); }
      break;
    case 'gameover':
      if (stateT > 4 || (stateT > 1 && (pressed.Enter || pressed.Space || touch.jumpP))) setState('title');
      break;
  }
  if (state !== 'pause') updateParts(dt);
  shake = Math.max(0, shake - dt * 14); flash = Math.max(0, flash - dt * 2.5);
  for (const f of floats) f.t += dt;
  floats = floats.filter(f => f.t < 1);
}

    const pop = 1 + 0.5 * Math.max(0, 1 - f.t * 7), a = 1 - Math.max(0, (f.t - 0.55) / 0.45);
    ctx.globalAlpha = a;
    text(f.s, f.x - camX, f.y - f.t * 22, { size: 7.5 * pop, w: 700, align: 'center', color: '#ffe08a', stroke: '#3a0d2e', sw: 2 });
    ctx.globalAlpha = 1;
  }
}
function drawScene() {
  drawBackdrop(camX);
  if (P) glow(P.x - camX, GROUND - 2, 60, WARM, 0.12, 0.22);
  drawMarkers();
  LV.draw();
  drawParts();
  drawFloats();
}
function vignette(a = 0.55) {
  ctx.fillStyle = radg(W / 2, H / 2, H * 0.3, W / 2, H / 2, W * 0.75, ['rgba(5,2,15,0)', `rgba(5,2,15,${a})`]);
  ctx.fillRect(0, 0, W, H);
}
function dim(a) { ctx.fillStyle = `rgba(8,3,22,${a})`; ctx.fillRect(0, 0, W, H); }
function card(cx, cy, w, h) {
  rr(cx - w / 2, cy - h / 2 + 2, w, h, 10, 'rgba(0,0,0,.35)');
  rr(cx - w / 2, cy - h / 2, w, h, 10, lin(0, cy - h / 2, 0, cy + h / 2, ['rgba(52,26,110,.92)', 'rgba(24,10,58,.94)']));
  ctx.lineWidth = 0.6; ctx.strokeStyle = 'rgba(255,200,74,.45)'; ctx.stroke();
}
function drawLogo(cx, y, s = 1) {
  ctx.save(); ctx.translate(cx, y); ctx.scale(s, s); ctx.rotate(Math.sin(gt * 1.4) * 0.015);
  glow(0, 14, 90, [255, 120, 200], 0.18, 0.5);
  text('BIG TOP', 0, 0, { size: 17, w: 700, align: 'center', ls: 3, color: lin(0, -9, 0, 9, ['#fff3c4', '#ffc84a']), stroke: '#2a0f4a', sw: 4, shadow: 'rgba(0,0,0,.35)', sd: 2 });
  text('Bonzo', 0, 25, { size: 34, w: 700, align: 'center', color: lin(0, 8, 0, 40, ['#ff9ab5', '#ff4d6d', '#c8174a']), stroke: '#2a0f4a', sw: 5, shadow: 'rgba(0,0,0,.4)', sd: 2.5 });
  for (let i = 0; i < 5; i++) { const a = gt * 0.8 + i * 1.26, r = 1.6 + Math.sin(gt * 4 + i) * 0.8; star(Math.cos(a) * 62, 14 + Math.sin(a) * 22, r, '#ffe08a', gt + i); }
  ctx.restore();
}
function drawTitle() {
  camX = 0;
  drawBackdrop(gt * 14);
  vignette(0.5);
  drawLogo(W / 2, 46, 1);
  const pulse = 1 + Math.sin(gt * 4) * 0.04;
  ctx.save(); ctx.translate(W / 2, 101); ctx.scale(pulse, pulse);
  rr(-44, -10, 88, 20, 10, lin(0, -10, 0, 10, ['#ff7a95', '#e0204f']));
  text(TOUCH ? 'Tap to play' : 'Press Enter', 0, 0.5, { size: 9, w: 700, align: 'center', color: '#fff8ee' });
  ctx.restore();
  text('BEST  ' + fmt(hi), W / 2, 122, { size: 6, w: 600, align: 'center', color: '#ffe08a', ls: 1 });
  if (!TOUCH) text('1–6 pick a stage  ·  7 piranha pool  ·  arrows + space to play', W / 2, 133, { size: 5.2, w: 500, align: 'center', color: '#c9bfe8' });
  // the troupe takes a bow
  const bx = W * 0.2, lx = W * 0.8;
  ctx.save(); ctx.translate(bx, GROUND); ctx.scale(1.35, 1.35);
  shadowAt(0, 0, 10); drawBall(0, 0, 8, gt * 1.2); drawBonzo(0, -16, 'balance'); ctx.restore();
  ctx.save(); ctx.translate(lx, GROUND); ctx.scale(-1.25, 1.25);
  shadowAt(0, 0, 14); drawLion(0, 0, gt * 6, true, false); drawBonzo(-4, -7.2, 'cheer'); ctx.restore();
  ctx.save(); ctx.translate(W * 0.36, GROUND); drawMonkey(0, 0, gt * 8, false); ctx.restore();
  ctx.save(); ctx.translate(W * 0.64, GROUND); drawBrazier(0, 0); ctx.restore();
}
function drawIntro() {
  drawScene(); drawHUD(); dim(0.45); vignette(0.5);
  const k = Math.min(1, stateT / 0.35), ease = 1 - Math.pow(1 - k, 3), y = 120 + (1 - ease) * 30;
  ctx.globalAlpha = ease;
  card(W / 2, y, 170, 74);
  text(`STAGE ${stageNum}`, W / 2, y - 22, { size: 6, w: 600, align: 'center', color: '#ffc84a', ls: 2 });
  text(LV.name(), W / 2, y - 6, { size: 17, w: 700, align: 'center', color: '#fff8ee' });
  if (loop > 1) text(`Round ${loop}  ·  everything's faster`, W / 2, y + 10, { size: 5.6, w: 600, align: 'center', color: '#ff9ab5' });
  for (let i = 0; i < Math.min(lives, 5); i++) heart(W / 2 - (Math.min(lives, 5) - 1) * 5 + i * 10, y + 23, 1.1, '#ff4d6d');
  ctx.globalAlpha = 1;
}
function render() {
  ctx.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
  ctx.imageSmoothingEnabled = true;
  if (state === 'title') return drawTitle();
  if (state === 'intro') return drawIntro();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawScene();
  if (flash > 0) { ctx.fillStyle = `rgba(255,40,80,${flash * 0.25})`; ctx.fillRect(-10, -10, W + 20, H + 20); }
  ctx.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
  drawHUD();
  if (state === 'pause') {
    dim(0.55);
    text('Paused', W / 2, 110, { size: 20, w: 700, align: 'center', color: '#fff8ee' });
    text(TOUCH ? 'Tap to keep playing' : 'Press P to keep playing', W / 2, 128, { size: 6.5, w: 500, align: 'center', color: '#c9bfe8' });
  }
  if (state === 'clear') {
    const k = Math.min(1, stateT / 0.4), s = 0.8 + 0.2 * (1 - Math.pow(1 - k, 3));
    ctx.save(); ctx.translate(W / 2, 108); ctx.scale(s, s); ctx.globalAlpha = k;
    card(0, 0, 160, 58);
    text('Stage clear!', 0, -11, { size: 16, w: 700, align: 'center', color: lin(0, -20, 0, 0, ['#fff3c4', '#ffc84a']) });
    text(`Time bonus  ${fmt(bonus)}`, 0, 8, { size: 7, w: 600, align: 'center', color: '#fff8ee' });
    text(`Score  ${fmt(score)}`, 0, 19, { size: 5.6, w: 500, align: 'center', color: '#c9bfe8' });
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (state === 'gameover') {
    dim(0.62); vignette(0.5);
    card(W / 2, 116, 170, 78);
    text('Game over', W / 2, 96, { size: 18, w: 700, align: 'center', color: '#ff8aa0' });
    text(`Score  ${fmt(score)}`, W / 2, 116, { size: 8.5, w: 700, align: 'center', color: '#fff8ee' });
    text(score >= hi && score > 0 ? 'New best score!' : `Best  ${fmt(hi)}`, W / 2, 128, { size: 6, w: 600, align: 'center', color: '#ffc84a' });
    if (stateT > 1) text(TOUCH ? 'Tap to continue' : 'Press Enter to continue', W / 2, 143, { size: 5.5, w: 500, align: 'center', color: '#c9bfe8' });
  }
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.033); last = now;
  try { update(dt); render(); } catch (e) { console.error(e); } // one bad frame must never stop the game
  pressed = {}; touch.jumpP = false;
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.load) ['500', '600', '700'].forEach(w => document.fonts.load(`${w} 12px Fredoka`).catch(() => {}));
setState('title');
requestAnimationFrame(frame);

// installable app: offline cache (needs https or localhost; skipped when opened as a plain file)
if ('serviceWorker' in navigator && /^(https:|http:\/\/(localhost|127\.0\.0\.1))/.test(location.href)) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
// already running as an installed app: it opens full screen, so the button isn't needed
if (matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone) $('fsBtn').style.display = 'none';
</script>
</body>
</html>
